<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Aluno</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <img src="assets/naruto_grupo.jpg" alt="Logo Naruto" class="logo">
        <h1>Média Aluno</h1>
        <label for="primeiroNumero">Informe a primeira nota:</label>
        <input type="number" id="primeiroNumero" placeholder="Ex: 4">
        <br><br>
        <label for="segundoNumero">Informe a segunda nota:</label>
        <input type="number" id="segundoNumero" placeholder="Ex: 7">
        <br><br>
        
        <label for="terceiroNumero">Informe a terceira nota:</label>
        <input type="number" id="terceiroNumero" placeholder="Ex: 9">
        <br><br>
        <button id="btnCalcular">Calcular média</button>

        <div id="resultado"></div>


        
    </div>
    <script src="script.js"></script>
    
</body>
</html>
